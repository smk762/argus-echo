name: Engines

# Each engine's unit tests, in that engine's own environment. They stub or mock the models, so no GPU or weights
# are needed. Miso resolves its locked environment (torch 2.9) from engines/miso/uv.lock; XTTS and Qwen stub torch;
# Whisper takes a fake model and VAD, so faster-whisper is not installed.
# Each engine's test dependencies are in its requirements-test.txt, which ai-code-auditor's validate_patch also reads.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [miso, xtts, qwen, whisper]
    defaults:
      run:
        working-directory: engines/${{ matrix.engine }}
    steps:
      - name: Free disk space
        if: matrix.engine == 'miso'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
        working-directory: .
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (errors only)
        run: uvx ruff@0.15.16 check --select E9,F63,F7,F82 .
      - name: pytest (miso)
        if: matrix.engine == 'miso'
        run: uv run --python 3.11 --with-requirements requirements-test.txt python -m pytest -q
      - name: pytest (${{ matrix.engine }})
        if: matrix.engine != 'miso'
        run: uv run --no-project --python 3.11 --with-requirements requirements-test.txt python -m pytest -q tests

  wyoming:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/wyoming
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (errors only)
        run: uvx ruff@0.15.16 check --select E9,F63,F7,F82 .
      - name: imports
        run: uv run --no-project --python 3.11 --with-requirements requirements.txt python -c "import tts_bridge, asr_bridge"
      - name: pytest
        run: uv run --no-project --python 3.11 --with-requirements requirements.txt --with pytest python -m pytest -q tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every profile resolves
        run: |
          for p in miso xtts qwen whisper wyoming-xtts wyoming-miso wyoming-qwen wyoming-whisper; do
            docker compose --profile "$p" config -q && echo "$p ok"
          done

  gpu-tenant:
    # gpu-tenant.yaml must validate as argus-cortex's TenantManifest (argus-iris refuses unknown fields).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run --no-project --python 3.12 --with "argus-cortex[yaml]>=0.15,<0.16"
          python -c "from argus_cortex.gpu_wire import load_tenant_manifest as load;
          m = load('gpu-tenant.yaml'); print(m.tenant, [r.name for r in m.residents])"
