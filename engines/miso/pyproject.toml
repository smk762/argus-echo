[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miso-tts"
version = "0.1.0"
description = "Miso TTS 8B inference code."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    # torchaudio 2.9 decodes through torchcodec (FFmpeg libraries; the image installs ffmpeg).
    "torchcodec==0.9.1",
    "tokenizers==0.22.2",
    "transformers==4.57.6",
    "huggingface_hub>=0.34,<1.0",
    "moshi==0.2.13",
    "bitsandbytes==0.49.2; sys_platform == 'linux'",
    "torchtune==0.6.1",
    "torchao==0.14.1",
    # miso_server.py: clone archives carry prompt.safetensors (never a pickle).
    "safetensors>=0.5.3",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher@d46d7d0893a583d8968ab3a6626e2289faec9152",
    # miso_server.py: admin bearer, upload caps, resident evict/wake (argus_cortex.auth, .limits, .resident) and
    # registration with the argus-iris GPU broker (argus_cortex.gpu; [remote] and [yaml] for the client and the
    # manifest).
    "argus-cortex[server,remote,yaml]>=0.15,<0.16",
    # miso_server.py: the STT client that fills a missing /clone-voice reference_text (MISO_STT_URL).
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["generator", "models", "moshi_compat", "watermarking"]

[tool.uv]
# Security floor past moshi's own pin (aiohttp<3.12, still in 0.2.13). Miso imports only moshi.models and
# moshi.utils; aiohttp is used by moshi's client/server CLIs alone. Drop this when moshi lifts the pin.
override-dependencies = ["aiohttp>=3.14.4"]
