# argus-iris tenant manifest for argus-echo. Validated by argus-cortex's TenantManifest
# (CI job `gpu-tenant`); unknown fields are refused.
#
# echo takes no leases: its engines are observed residents that iris unloads, evicts and
# wakes through the argus-http adapter. No `node` and no `base_url`: each engine runs on
# whichever host can hold it (Miso needs ~17 GB VRAM; XTTS, Qwen and Whisper fit in 8 GB), and the
# deployment tells iris where, in iris's own `services` config. Container names match
# compose.yaml.
tenant_version: "1.0"
tenant: argus-echo
description: Speech servers (Miso TTS 8B, XTTS-v2, Qwen3-TTS; Whisper speech-to-text) behind one HTTP contract per capability.
repo: smk762/argus-echo
kinds: []
residents:
  # Miso 8B (bf16, torch 2.9.1): torch reserves 17.7 GB; measured peak 18.1 GB of device memory on an RTX 3090,
  # CUDA context included, across /synthesise, /clone-voice and /synthesise/stream.
  # /admin/evict parks Miso on CPU (~17 GB of host RAM); MISO_KEEP_ALIVE_GPU still unloads it when idle.
  - name: miso
    adapter: argus-http
    container: argus-echo-miso
    vram_mb: 18500
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  - name: xtts
    adapter: argus-http
    container: argus-echo-xtts
    vram_mb: 2000
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  # Qwen3-TTS 1.7b, CustomVoice only (QWEN_LOAD_MODELS=custom_voice): measured on dragon's RTX 4060 (8 GB), CUDA
  # context included: 4.8 GB of device memory loaded, and a generation stays inside it (torch: 4.0 GB allocated,
  # 4.5 GB reserved); 4.4 GB just after /admin/wake. /admin/evict and /admin/unload leave only the CUDA context
  # (~150 MB).
  # What this figure covers. Compose's default is 0.6b with `both` (Base too, for cloning): two 0.6B models, fewer
  # weights than one 1.7B, so expected inside 4800 but NOT MEASURED (#6). 1.7b with `both` loads two 1.7B models,
  # roughly twice this: raise vram_mb (about 9000) in the deployment's copy before running it, or iris will place
  # other tenants in memory Qwen uses. So does a checkpoint loaded with /admin/load into a slot QWEN_LOAD_MODELS
  # leaves out (a base checkpoint on a custom_voice deployment loads both models).
  - name: qwen
    adapter: argus-http
    container: argus-echo-qwen
    vram_mb: 4800
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  # Whisper large-v3-turbo (CTranslate2 float16): measured peak 2.8 GB on an RTX 3090, CUDA context included,
  # with CT2_CUDA_CACHING_ALLOCATOR_CONFIG capping the allocator's cache at 200 MiB and one transcription at a time.
  # /admin/evict parks the weights in host RAM (~1.7 GB); about 0.5 GB of CUDA context stays until the process exits.
  - name: whisper
    adapter: argus-http
    container: argus-echo-whisper
    vram_mb: 3000
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true
