# argus-iris tenant manifest for argus-echo. Validated by argus-cortex's TenantManifest
# (CI job `gpu-tenant`); unknown fields are refused.
#
# echo takes no leases: its engines are observed residents that iris unloads, evicts and
# wakes through the argus-http adapter. No `node` and no `base_url`: each engine runs on
# whichever host can hold it (Miso needs ~17 GB VRAM; XTTS, Qwen and Whisper fit in 8 GB). Every
# engine registers this file with iris at startup when ARGUS_GPU_BROKER_URL is set (compose mounts
# it at /app/gpu-tenant.yaml), and iris places each resident on the node whose agent reports its
# container, at that container's published port. Container names match compose.yaml; each
# publishes one port, so no resident needs `port`.
tenant_version: "1.0"
tenant: argus-echo
description: Speech servers (Miso TTS 8B, XTTS-v2, Qwen3-TTS; Whisper speech-to-text) behind one HTTP contract per capability.
repo: smk762/argus-echo
kinds: []
residents:
  # Miso 8B (bf16, torch 2.9.1): torch reserves 17.7 GB; measured peak 18.1 GB of device memory on an RTX 3090,
  # CUDA context included, across /synthesise, /clone-voice and /synthesise/stream.
  # /admin/evict parks Miso on CPU (~17 GB of host RAM); MISO_KEEP_ALIVE_GPU still unloads it when idle.
  - name: miso
    adapter: argus-http
    container: argus-echo-miso
    vram_mb: 18500
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  - name: xtts
    adapter: argus-http
    container: argus-echo-xtts
    vram_mb: 2000
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  # Qwen3-TTS 0.6b with Base and CustomVoice (QWEN_LOAD_MODELS=both, compose's default, needed for cloning):
  # measured on dragon's RTX 4060 (8 GB) with echo 0.3.0, per process (NVML), CUDA context included: 4366 MiB after
  # /admin/wake, 4548 MiB peak speaking a built-in speaker, 5178 MiB peak speaking an ICL clone (11 s reference) on
  # /synthesise and /synthesise/stream (torch keeps that cached until evicted), and 5692 MiB speaking two 27 s clone
  # utterances (a longer generation grows the working set); 178 MiB after /admin/evict, 144 MiB after /admin/unload
  # (#6). vram_mb is that peak plus headroom, as for Miso and Whisper.
  # Other configurations need their own figure in the deployment's copy: 1.7b CustomVoice only measured 4.8 GB
  # (#27); 1.7b with `both` is unmeasured, roughly twice that (about 9000), and doesn't fit beside other tenants
  # on an 8 GB card. A checkpoint loaded with /admin/load into a slot QWEN_LOAD_MODELS leaves out loads that model
  # too.
  - name: qwen
    adapter: argus-http
    container: argus-echo-qwen
    vram_mb: 5800
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true

  # Whisper large-v3-turbo (CTranslate2 float16): measured peak 2.8 GB on an RTX 3090, CUDA context included,
  # with CT2_CUDA_CACHING_ALLOCATOR_CONFIG capping the allocator's cache at 200 MiB and one transcription at a time.
  # /admin/evict parks the weights in host RAM (~1.7 GB); about 0.5 GB of CUDA context stays until the process exits.
  - name: whisper
    adapter: argus-http
    container: argus-echo-whisper
    vram_mb: 3000
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: true
