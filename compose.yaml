# argus-echo's engines. Each has its own profile, so a host runs only the ones it
# can hold:
#   docker compose --profile miso up -d                  # 24 GB GPU: Miso 8B (~17 GB VRAM)
#   docker compose --profile xtts --profile qwen up -d   # 8 GB GPU: XTTS-v2 (~2 GB), Qwen3-TTS 0.6B
#   docker compose --profile whisper up -d               # speech to text: Whisper large-v3-turbo (~3 GB VRAM)
#   docker compose --profile wyoming-xtts up -d          # Wyoming TTS bridge (CPU) in front of an engine
#   docker compose --profile wyoming-whisper up -d       # Wyoming ASR bridge (CPU) in front of whisper
#
# Every port is published as ${ECHO_BIND}:<port>. ECHO_BIND defaults to loopback; set it to
# 0.0.0.0 or a LAN address to serve other machines. /admin/* is closed until
# ARGUS_ADMIN_TOKEN is set. Settings: .env.example; reference: docs/.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

# One S3 endpoint, but a bucket per engine: every engine stores a clone at
# voice_clones/<companion_id>/prompt.pt, and the three prompt.pt formats differ, so a
# shared bucket would let a clone on one engine overwrite another's.
x-s3: &s3
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

x-health: &health
  interval: 30s
  timeout: 5s
  retries: 10
  start_period: 120s

services:
  miso:
    profiles: [miso]
    build:
      context: ./engines/miso
    image: ghcr.io/smk762/argus-echo-miso:${ECHO_TAG:-local}
    container_name: argus-echo-miso
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${MISO_PORT:-8140}:8031"
    environment:
      <<: *s3
      S3_BUCKET_NAME: ${MISO_S3_BUCKET:-voice-miso}
      S3_PUBLIC_URL: ${MISO_S3_PUBLIC_URL:-}
      MISO_MODEL: ${MISO_MODEL:-MisoLabs/MisoTTS}
      MISO_DEVICE: cuda
      MISO_PORT: "8031"
      MISO_PRELOAD: ${MISO_PRELOAD:-0}
      MISO_TTS_TOKENIZER: ${MISO_TTS_TOKENIZER:-unsloth/Llama-3.2-1B}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /hf-cache
      HF_HUB_CACHE: /hf-cache/hub
      # local: files under /data, served at GET /media/{key}; s3: the S3_* bucket.
      MISO_STORAGE_BACKEND: ${MISO_STORAGE_BACKEND:-local}
      MISO_DATA_DIR: /data
      # The container cannot see its published address: set the URL clients use.
      MISO_PUBLIC_URL: ${MISO_PUBLIC_URL:-http://localhost:${MISO_PORT:-8140}}
      MISO_KEEP_ALIVE_GPU: ${MISO_KEEP_ALIVE_GPU:-300}
      MISO_KEEP_ALIVE_CPU: ${MISO_KEEP_ALIVE_CPU:-0}
      # Speech-to-text engine that transcribes /clone-voice clips sent without reference_text
      # (e.g. http://whisper:8031 with the whisper profile). Empty: such clones have no transcript.
      MISO_STT_URL: ${MISO_STT_URL:-}
      MISO_STT_TIMEOUT_S: ${MISO_STT_TIMEOUT_S:-60}
      ARGUS_ADMIN_TOKEN: ${ARGUS_ADMIN_TOKEN:-}
      ARGUS_ADMIN_INSECURE: ${ARGUS_ADMIN_INSECURE:-}
      # Mimi's streaming decoder under CUDA graphs cuts every streamed utterance short.
      NO_CUDA_GRAPH: ${MISO_NO_CUDA_GRAPH:-1}
      NO_TORCH_COMPILE: "1"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Hugging Face cache: the ~33 GB checkpoint downloads here once. Point HF_HOME
      # at an existing cache to reuse it.
      - ${HF_HOME:-./cache/huggingface}:/hf-cache
      - ${MISO_DATA_DIR:-./data/miso}:/data
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/health', timeout=5).read()"]
    <<: *gpu

  xtts:
    profiles: [xtts]
    build:
      context: ./engines/xtts
    image: ghcr.io/smk762/argus-echo-xtts:${ECHO_TAG:-local}
    container_name: argus-echo-xtts
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${XTTS_PORT:-8141}:8031"
    environment:
      <<: *s3
      S3_BUCKET_NAME: ${XTTS_S3_BUCKET:-voice-xtts}
      S3_PUBLIC_URL: ${XTTS_S3_PUBLIC_URL:-}
      XTTS_DEVICE: ${XTTS_DEVICE:-cuda:0}
      XTTS_PRELOAD: ${XTTS_PRELOAD:-0}
      XTTS_KEEP_ALIVE_GPU: ${XTTS_KEEP_ALIVE_GPU:-120}
      XTTS_KEEP_ALIVE_CPU: ${XTTS_KEEP_ALIVE_CPU:-600}
      ARGUS_ADMIN_TOKEN: ${ARGUS_ADMIN_TOKEN:-}
      ARGUS_ADMIN_INSECURE: ${ARGUS_ADMIN_INSECURE:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/health', timeout=5).read()"]
    <<: *gpu

  qwen:
    profiles: [qwen]
    build:
      context: ./engines/qwen
      args:
        TTS_MODEL_SIZE: ${QWEN_MODEL_SIZE:-0.6b}
    image: ghcr.io/smk762/argus-echo-qwen:${ECHO_TAG:-local}
    container_name: argus-echo-qwen
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${QWEN_PORT:-8142}:8031"
    environment:
      <<: *s3
      S3_BUCKET_NAME: ${QWEN_S3_BUCKET:-voice-qwen}
      S3_PUBLIC_URL: ${QWEN_S3_PUBLIC_URL:-}
      TTS_MODEL_SIZE: ${QWEN_MODEL_SIZE:-0.6b}
      TTS_DEVICE: ${QWEN_DEVICE:-cuda:0}
      TTS_PRELOAD: ${QWEN_PRELOAD:-0}
      TTS_KEEP_ALIVE_GPU: ${QWEN_KEEP_ALIVE_GPU:-120}
      TTS_KEEP_ALIVE_CPU: ${QWEN_KEEP_ALIVE_CPU:-600}
      ARGUS_ADMIN_TOKEN: ${ARGUS_ADMIN_TOKEN:-}
      ARGUS_ADMIN_INSECURE: ${ARGUS_ADMIN_INSECURE:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/health', timeout=5).read()"]
    <<: *gpu

  # Speech to text (the stt contract). No storage: audio is transcribed in memory and kept nowhere.
  whisper:
    profiles: [whisper]
    build:
      context: ./engines/whisper
    image: ghcr.io/smk762/argus-echo-whisper:${ECHO_TAG:-local}
    container_name: argus-echo-whisper
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${WHISPER_PORT:-8144}:8031"
    environment:
      STT_DEVICE: ${WHISPER_DEVICE:-cuda}
      STT_PRELOAD: ${WHISPER_PRELOAD:-0}
      STT_KEEP_ALIVE_GPU: ${WHISPER_KEEP_ALIVE_GPU:-300}
      STT_KEEP_ALIVE_CPU: ${WHISPER_KEEP_ALIVE_CPU:-600}
      STT_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      STT_MAX_UPLOAD_MB: ${WHISPER_MAX_UPLOAD_MB:-50}
      STT_MAX_SECONDS: ${WHISPER_MAX_SECONDS:-600}
      STT_QUEUE_TIMEOUT_S: ${WHISPER_QUEUE_TIMEOUT_S:-30}
      STT_STREAM_MAX_SESSIONS: ${WHISPER_STREAM_MAX_SESSIONS:-4}
      ARGUS_ADMIN_TOKEN: ${ARGUS_ADMIN_TOKEN:-}
      ARGUS_ADMIN_INSECURE: ${ARGUS_ADMIN_INSECURE:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/health', timeout=5).read()"]
    <<: *gpu

  # Wyoming TTS bridges (CPU). Each forwards to one engine's /synthesise/stream; point
  # *_ENGINE_URL elsewhere to bridge an engine on another host.
  wyoming-xtts:
    profiles: [wyoming-xtts]
    build:
      context: ./engines/wyoming
    image: ghcr.io/smk762/argus-echo-wyoming:${ECHO_TAG:-local}
    container_name: argus-echo-wyoming-xtts
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${WYOMING_XTTS_PORT:-10240}:10200"
    environment:
      TTS_URL: ${WYOMING_XTTS_ENGINE_URL:-http://xtts:8031}

  wyoming-miso:
    profiles: [wyoming-miso]
    build:
      context: ./engines/wyoming
    image: ghcr.io/smk762/argus-echo-wyoming:${ECHO_TAG:-local}
    container_name: argus-echo-wyoming-miso
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${WYOMING_MISO_PORT:-10241}:10200"
    environment:
      TTS_URL: ${WYOMING_MISO_ENGINE_URL:-http://miso:8031}
      WYOMING_TTS_PROGRAM_NAME: miso
      WYOMING_TTS_PROGRAM_DESC: Miso TTS 8B (voice cloning)
      WYOMING_TTS_ATTRIBUTION_NAME: Miso Labs
      WYOMING_TTS_ATTRIBUTION_URL: https://huggingface.co/MisoLabs/MisoTTS
      WYOMING_TTS_LANGUAGE: en
      WYOMING_TTS_LANGUAGES: en

  # Qwen renders the whole clip before sending it, so first audio arrives only when
  # the utterance is done (Miso and XTTS start within a sentence). Qwen has no
  # GET /clones, so only the default speaker is advertised.
  wyoming-qwen:
    profiles: [wyoming-qwen]
    build:
      context: ./engines/wyoming
    image: ghcr.io/smk762/argus-echo-wyoming:${ECHO_TAG:-local}
    container_name: argus-echo-wyoming-qwen
    restart: unless-stopped
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${WYOMING_QWEN_PORT:-10242}:10200"
    environment:
      TTS_URL: ${WYOMING_QWEN_ENGINE_URL:-http://qwen:8031}
      XTTS_DEFAULT_SPEAKER: ${WYOMING_QWEN_SPEAKER:-ryan}
      WYOMING_TTS_PROGRAM_NAME: qwen
      WYOMING_TTS_PROGRAM_DESC: Qwen3-TTS (built-in speakers)
      WYOMING_TTS_ATTRIBUTION_NAME: Qwen
      WYOMING_TTS_ATTRIBUTION_URL: https://huggingface.co/Qwen
      WYOMING_TTS_LANGUAGE: en
      WYOMING_TTS_LANGUAGES: en,zh,ja,ko,de,fr,ru,pt,es,it

  # Wyoming ASR bridge (CPU, same image): buffers each utterance and posts it to the
  # whisper engine's POST /transcribe. Home Assistant adds it as a speech-to-text service.
  wyoming-whisper:
    profiles: [wyoming-whisper]
    build:
      context: ./engines/wyoming
    image: ghcr.io/smk762/argus-echo-wyoming:${ECHO_TAG:-local}
    container_name: argus-echo-wyoming-whisper
    restart: unless-stopped
    command: ["python", "asr_bridge.py"]
    ports:
      - "${ECHO_BIND:-127.0.0.1}:${WYOMING_WHISPER_PORT:-10243}:10300"
    environment:
      STT_URL: ${WYOMING_WHISPER_ENGINE_URL:-http://whisper:8031}
      # Blank: the language Home Assistant sends, else detect.
      WYOMING_ASR_LANGUAGE: ${WYOMING_WHISPER_LANGUAGE:-}
      WYOMING_ASR_TIMEOUT: ${WYOMING_WHISPER_TIMEOUT:-120}
